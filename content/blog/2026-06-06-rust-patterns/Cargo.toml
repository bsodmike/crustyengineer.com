[package]
name = "rust-patterns"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
mime = "0.3.17"

[lints.rust]
dead_code = "allow"

[[example]]
name = "experiment"
path = "examples/experiment.rs"
